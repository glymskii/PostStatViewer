name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Provide dummy env so Next.js doesn't complain at build time about
        # missing JWT_SECRET. Real values come from Railway at runtime.
        env:
          JWT_SECRET: ci-dummy-secret-not-used-at-runtime
        run: npm run build
